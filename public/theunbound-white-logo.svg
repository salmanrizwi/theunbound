<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Vibrant Teal Background -->
  <rect width="500" height="500" rx="40" fill="#00A88F"/>

  <!-- All-White Angled Dual-U Brand Mark -->
  <g transform="translate(250, 200) rotate(-45) translate(-80, -80)">
    <!-- Top Link (White U) -->
    <path
      d="M 52 40 L 52 76 C 52 91.5 64.5 104 80 104 C 95.5 104 108 91.5 108 76 L 108 40 L 88 40 L 88 74 C 88 78.4 84.4 82 80 82 C 75.6 82 72 78.4 72 74 L 72 40 Z"
      fill="#FFFFFF"
    />
    <!-- Bottom Link (White Inverted U) -->
    <path
      d="M 52 120 L 52 84 C 52 68.5 64.5 56 80 56 C 95.5 56 108 68.5 108 84 L 108 120 L 88 120 L 88 86 C 88 81.6 84.4 78 80 78 C 75.6 78 72 81.6 72 86 L 72 120 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- All-White Wordmark: theunbound -->
  <text 
    x="250" 
    y="390" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="58" 
    letter-spacing="-1.5px" 
    fill="#FFFFFF"
  >
    theunbound
  </text>
</svg>
